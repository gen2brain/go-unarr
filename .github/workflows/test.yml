on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.21.x, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Vet
      run: go vet ./...
    - name: Test
      if: matrix.os != 'macos-latest' || matrix.go-version != '1.21.x'
      run: go test ./...
    - name: Test clobberfree
      if: matrix.os != 'macos-latest' || matrix.go-version != '1.21.x'
      run: go test -count=1 .
      env:
        GODEBUG: clobberfree=1
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Format
      run: |
        if [ -n "$(gofmt -l $(git ls-files '*.go'))" ]; then
          gofmt -d $(git ls-files '*.go')
          exit 1
        fi
